<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>银行代码查询系统</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .auth-box {
      max-width: 400px;
      margin: 40px auto;
      padding: 24px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; margin-bottom: 6px; font-weight: 500; }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .search-box { display: flex; gap: 12px; margin-bottom: 24px; }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background-color: var(--primary-hover); }
    .hidden { display: none !important; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background-color: #f1f5f9; }
    .badge-role {
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- 登录区域 -->
  <div id="login-section" class="auth-box">
    <h2><i class="fa-solid fa-lock"></i> 用户登录</h2>
    <div class="input-group">
      <label>用户名</label>
      <input type="text" id="login-username" placeholder="请输入用户名">
    </div>
    <div class="input-group">
      <label>密码</label>
      <input type="password" id="login-password" placeholder="请输入密码">
    </div>
    <button style="width: 100%;" onclick="handleLogin()">登录</button>
  </div>

  <!-- 搜索面板（登录后显示） -->
  <div id="main-section" class="container hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2><i class="fa-solid fa-database"></i> 银行代码查询系统</h2>
      <button onclick="handleLogout()" style="background: #64748b;">退出登录</button>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="请输入关键词搜索..." onkeyup="if(event.key==='Enter') handleSearch()">
      <button onclick="handleSearch()"><i class="fa-solid fa-magnifying-glass"></i> 搜索</button>
    </div>

    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>银行 (Tab)</th>
            <th>代码 (A)</th>
            <th>信息 (B)</th>
            <th>信息 (C)</th>
            <th>信息 (D)</th>
            <th>信息 (E)</th>
            <th>信息 (F)</th>
          </tr>
        </thead>
        <tbody id="search-results">
          <tr>
            <td colspan="7" style="text-align: center; color: #64748b; padding: 30px;">请在上方输入关键词并点击搜索</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE = "https://script.google.com/macros/s/AKfycbxjSxPCeMR2YnjaC2mxoulDwVDBQschzx6orkrKgofuE-mUlYFuIHhnmTz5P2hSeViicA/exec";
    const API_SECRET = "lg553";

    let currentUser = null;
    let allUsersData = [];

    window.onload = function() {
      loadUsersData();
    };

    // 获取并合并用户数据
    async function loadUsersData() {
      let sheetUsers = [];
      try {
        const res = await fetch(`${API_BASE}?action=getUsers&secret=${API_SECRET}`);
        const data = await res.json();
        if (Array.isArray(data)) {
          sheetUsers = data;
        }
      } catch (e) {
        console.warn("获取用户失败，使用本地缓存");
      }

      let localUsers = JSON.parse(localStorage.getItem("app_registered_users") || "[]");
      let combinedMap = new Map();
      sheetUsers.forEach(u => { if (u && u.username) combinedMap.set(u.username, u); });
      localUsers.forEach(u => { if (u && u.username) combinedMap.set(u.username, u); });

      allUsersData = Array.from(combinedMap.values());
    }

    // 处理登录
    function handleLogin() {
      const uVal = document.getElementById("login-username").value.trim();
      const pVal = document.getElementById("login-password").value.trim();

      const user = allUsersData.find(u => u.username === uVal && u.password === pVal);

      if (user) {
        currentUser = user;
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("main-section").classList.remove("hidden");
      } else {
        alert("用户名或密码错误！");
      }
    }

    // 退出登录
    function handleLogout() {
      currentUser = null;
      document.getElementById("login-section").classList.remove("hidden");
      document.getElementById("main-section").classList.add("hidden");
    }

    // 处理搜索
    async function handleSearch() {
      const rawInput = document.getElementById("search-input").value;
      const keyword = rawInput.trim();
      const tbody = document.getElementById("search-results");

      if (!keyword) {
        alert("请输入要查找的内容！");
        return;
      }

      tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 30px;">正在搜索...</td></tr>`;

      try {
        const res = await fetch(`${API_BASE}?action=search&keyword=${encodeURIComponent(keyword)}&secret=${API_SECRET}`);
        const results = await res.json();

        if (Array.isArray(results) && results.length > 0) {
          tbody.innerHTML = results.map(item => `
            <tr>
              <td><span class="badge-role">${item.sheetName}</span></td>
              <td><b>${item.colA}</b></td>
              <td>${item.colB}</td>
              <td>${item.colC}</td>
              <td>${item.colD}</td>
              <td>${item.colE}</td>
              <td>${item.colF}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--danger); padding: 30px;">未找到匹配记录</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--danger); padding: 30px;">请求失败，请检查配置。</td></tr>`;
      }
    }
  </script>
</body>
</html>
