<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>银行代码与数据查询系统</title>
  <!-- 引入图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h2 {
      margin-top: 0;
      color: var(--primary);
    }
    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    button {
      padding: 12px 24px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background-color: #f1f5f9;
      font-weight: 600;
    }
    .badge-role {
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2><i class="fa-solid fa-database"></i> 银行代码查询系统</h2>
    
    <!-- 搜索输入区域 -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="请输入关键词搜索（例如：46 R1）..." onkeyup="if(event.key==='Enter') handleSearch()">
      <button onclick="handleSearch()"><i class="fa-solid fa-magnifying-glass"></i> 搜索</button>
    </div>

    <!-- 结果列表表格 -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>银行 (Tab)</th>
            <th>代码 (A)</th>
            <th>信息 (B)</th>
            <th>信息 (C)</th>
            <th>信息 (D)</th>
            <th>信息 (E)</th>
            <th>信息 (F)</th>
          </tr>
        </thead>
        <tbody id="search-results">
          <tr>
            <td colspan="7" style="text-align: center; color: #64748b; padding: 30px;">
              <i class="fa-solid fa-circle-info"></i> 请在上方输入关键词并点击搜索
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- JavaScript 业务逻辑 -->
  <script>
    // 1. 设置 API 基础地址与安全秘钥
    const API_BASE = "https://script.google.com/macros/s/AKfycbxjSxPCeMR2YnjaC2mxoulDwVDBQschzx6orkrKgofuE-mUlYFuIHhnmTz5P2hSeViicA/exec";
    const API_SECRET = "lg553";

    let currentUser = null;
    let allUsersData = [];
    let editingUserIndex = null;

    // 页面完全加载后调用
    window.onload = function() {
      loadUsersData();
    };

    // 2. 获取并合并用户数据
    async function loadUsersData() {
      let sheetUsers = [];
      try {
        const res = await fetch(`${API_BASE}?action=getUsers&secret=${API_SECRET}`);
        sheetUsers = await res.json();
      } catch (e) {
        console.warn("读取 Users 失败，使用本地缓存");
      }

      let localUsers = JSON.parse(localStorage.getItem("app_registered_users") || "[]");
      let combinedMap = new Map();
      sheetUsers.forEach(u => combinedMap.set(u.username, u));
      localUsers.forEach(u => combinedMap.set(u.username, u));

      allUsersData = Array.from(combinedMap.values());
      if (typeof renderUsersList === 'function') {
        renderUsersList();
      }
    }

    // 3. 搜索数据处理函数
    async function handleSearch() {
      const rawInput = document.getElementById("search-input").value;
      const keyword = rawInput.trim();
      const tbody = document.getElementById("search-results");

      if (!keyword) {
        alert("请输入要查找的内容！");
        return;
      }

      tbody.innerHTML = `
        <tr>
          <td colspan="7" style="text-align: center; padding: 30px;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: var(--primary);"></i><br><br>
            正在搜索并排序数据...
          </td>
        </tr>`;

      try {
        const res = await fetch(`${API_BASE}?action=search&keyword=${encodeURIComponent(keyword)}&secret=${API_SECRET}`);
        const results = await res.json();

        if (results && results.length > 0) {
          tbody.innerHTML = results.map(item => `
            <tr>
              <td><span class="badge-role"><i class="fa-solid fa-table"></i> ${item.sheetName}</span></td>
              <td><b style="color: var(--primary); font-size: 15px;">${item.colA}</b></td>
              <td>${item.colB}</td>
              <td>${item.colC}</td>
              <td>${item.colD}</td>
              <td>${item.colE}</td>
              <td>${item.colF}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" style="text-align: center; color: var(--danger); padding: 30px;">
                <i class="fa-solid fa-folder-open"></i> 未找到匹配 "${rawInput}" 的记录
              </td>
            </tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; color: var(--danger); padding: 30px;">
              请求失败，请检查网络或后端配置。
            </td>
          </tr>`;
      }
    }
  </script>
</body>
</html>
